{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Modify your logged transaction details</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id, return_to=return_to) }}">
                <input type="hidden" name="return_to" value="{{ return_to }}">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required style="background-color: var(--paper); height: 42px;">
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" class="form-input" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ expense.date }}" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" value="{{ expense.description or '' }}" class="form-input" placeholder="e.g. BigBasket Groceries">
                </div>
                
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('profile') if return_to == 'profile' else url_for('dashboard') }}" class="btn-ghost" style="display: block; text-align: center; margin-top: 0.75rem; width: 100%;">Cancel</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
