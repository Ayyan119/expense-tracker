{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Log a new transaction to your account</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required style="background-color: var(--paper); height: 42px;">
                        <option value="" disabled {% if not form_data or not form_data.category %}selected{% endif %}>Select category...</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if form_data and form_data.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" class="form-input" placeholder="0.00" value="{{ form_data.amount if form_data else '' }}" required>
                </div>
                
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" value="{{ form_data.date if form_data else '' }}" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" class="form-input" placeholder="e.g. BigBasket Groceries" value="{{ form_data.description if form_data else '' }}">
                </div>
                
                <button type="submit" class="btn-submit">Add Expense</button>
                <a href="{{ url_for('profile') }}" class="btn-ghost" style="display: block; text-align: center; margin-top: 0.75rem; width: 100%;">Cancel</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    // Auto-set the date field to today if it's empty
    document.addEventListener("DOMContentLoaded", function() {
        const dateInput = document.getElementById("date");
        if (dateInput && !dateInput.value) {
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }
    });
</script>
{% endblock %}
